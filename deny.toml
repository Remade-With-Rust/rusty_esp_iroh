# cargo-deny configuration — the permissive-only, no-C posture, enforced.
# Run: cargo deny check

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # public-domain dedication (async_io_stream, pharos, under iroh's wasm websocket path)
  "Unlicense",
  # the Mozilla root store as webpki-roots ships it
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A `*-sys` crate is a decision stated out loud in the PR, never a default.
deny = [
  { crate = "openssl-sys", reason = "no C toolchain anywhere in the build" },
  { crate = "libz-sys", reason = "use rusty_zstd / pure-Rust inflate" },
  { crate = "zstd-sys", reason = "use rusty_zstd" },
  { crate = "ring", reason = "platform asm; use RustCrypto / rustls-rustcrypto" },
  { crate = "aws-lc-sys", reason = "C; use RustCrypto / rustls-rustcrypto" },
]

[advisories]
ignore = [
  # Unmaintained, not vulnerable: both arrive through n0's iroh graph (heapless /
  # embassy helpers) and are build-time macro or polyfill crates. Revisit when
  # the iroh branches move; an `unmaintained` row is not a reason to fork.
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill: unmaintained polyfill pulled by iroh's embedded helpers; no code path of ours" },
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro, build-time only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/Remade-With-Rust/rusty_esp_core",
  "https://github.com/Remade-With-Rust/rusty_esp_mid",
  "https://github.com/Remade-With-Rust/rusty_esp_video",
  "https://github.com/Remade-With-Rust/rusty_esp_signal",
  "https://github.com/Remade-With-Rust/rusty_esp_image",
  # through image-core / signal-core: the shared kernels live in rusty_esp_dsp since D0
  "https://github.com/Remade-With-Rust/rusty_esp_dsp",
  # through rusty_esp_mid-core: the mID wire types on the upstream no-std branch (M5)
  "https://github.com/Remade-With-Rust/mid",
  # n0's rustls-rustcrypto branch: the pure-Rust TLS provider iroh needs to
  # build for Xtensa, and what keeps ring/aws-lc out of the host graph too.
  "https://github.com/n0-computer/rustls-rustcrypto",
]
