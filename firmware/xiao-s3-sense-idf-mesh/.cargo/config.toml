[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# The 6 MiB factory partition an iroh image needs (partitions.csv in this dir).
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
# Size-first std/core/alloc codegen (n0: ~181 KB off .flash.text, behaviour-neutral).
build-std-features = ["optimize_for_size"]

[env]
# embuild finds the project by walking up from the target dir; with
# CARGO_TARGET_DIR pointing outside the project (a must on Windows, see the
# README) that lands on the wrong directory and every
# [package.metadata.esp-idf-sys] setting above is silently ignored. Pin it.
CARGO_WORKSPACE_DIR = { value = "", relative = true }
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.5.1"
# Belt to the manifest's braces: esp-idf-sys reads env before cargo metadata,
# so even when its `cargo metadata --locked` fails (it does on a fresh lockfile
# and after a profile change reruns the build script) the IDF stays in the
# global dir instead of being cloned into this project.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
# Keeps `cc` from injecting host defaults into the cross build.
CRATE_CC_NO_DEFAULTS = "1"
