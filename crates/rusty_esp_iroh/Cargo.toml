[package]
name = "rusty_esp_iroh"
description = "The MATA mesh on the chip: an iroh endpoint on ESP32 (std/ESP-IDF track), Janus ALPN protocols (rpc, media, telemetry), a host client, and a bridge that fronts no_std nodes on the mesh. Replaces cloud-IoT device SDKs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_esp_iroh"
keywords = ["esp32", "embedded", "no-std", "mata", "remade-with-rust"]
categories = ["embedded", "no-std", "hardware-support"]

[features]
default = ["std"]
std = ["rusty_esp_iroh-core/std", "rusty_esp_iroh-esp/std"]
alloc = ["rusty_esp_iroh-core/alloc"]
# Track B: bare metal, esp-hal + Embassy.
esp-hal = ["rusty_esp_iroh-esp/esp-hal"]
# Track A: std on ESP-IDF via esp-idf-svc.
esp-idf = ["rusty_esp_iroh-esp/esp-idf"]

[dependencies]
rusty_esp_iroh-core = { workspace = true }
rusty_esp_iroh-esp = { workspace = true }

[lints]
workspace = true
