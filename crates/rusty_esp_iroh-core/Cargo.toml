[package]
name = "rusty_esp_iroh-core"
description = "The pure no_std core of rusty_esp_iroh: the Janus mesh protocols (ALPNs, tickets, the DID-to-endpoint binding, postcard RPC with mID assertions, media framing, the mata-oem-sidecar JSON contract). No sockets, no iroh. forbid(unsafe)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_esp_iroh-core"
keywords = ["esp32", "embedded", "no-std", "iroh", "remade-with-rust"]
categories = ["embedded", "no-std", "network-programming"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` and still builds on riscv32 bare metal: ALPNs,
# tickets, the binding and the caller assertion need no heap. `alloc` adds the
# postcard RPC messages, media framing helpers and the sidecar JSON.
std = ["alloc", "rusty_esp_core/std", "rusty_esp_mid-core/std", "serde?/std", "serde_json?/std", "postcard?/use-std"]
alloc = [
    "rusty_esp_core/alloc",
    "rusty_esp_mid-core/alloc",
    "dep:serde",
    "dep:postcard",
    "dep:serde_json",
    "serde/alloc",
    "postcard/alloc",
    "serde_json/alloc",
]

[dependencies]
rusty_esp_core = { workspace = true }
rusty_esp_mid-core = { workspace = true }
# The OTA image digest; already in the graph under rusty_esp_mid-core.
sha2 = { version = "0.10", default-features = false }
serde = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
